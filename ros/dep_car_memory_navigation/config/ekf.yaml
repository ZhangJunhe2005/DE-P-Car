# Policy inputs are LiDAR-anchored and require bracketing state samples no
# farther than 20 ms away.  30 Hz has a 33.3 ms interval and cannot satisfy
# that contract for arbitrary sensor phase; 100 Hz can do so without Gazebo
# pose truth.
frequency: 100
sensor_timeout: 0.25
two_d_mode: true
transform_time_offset: 0.0
transform_timeout: 0.1
print_diagnostics: true
publish_tf: true
publish_acceleration: false

map_frame: map
odom_frame: odom
base_link_frame: dummy
world_frame: odom

odom0: /dep_car/wheel_odom
# Preserve the frozen scenario's initial x/y reference and signed longitudinal
# speed carried by wheel odometry.  Do not fuse its bicycle-integrated yaw or
# yaw rate: steering noise during stop/shift phases used to fight the IMU and
# produce the large heading jumps visible in the accumulated trail.
odom0_config: [true,  true,  false,
               false, false, false,
               true,  false, false,
               false, false, false,
               false, false, false]
odom0_queue_size: 20
odom0_nodelay: true
odom0_differential: false
odom0_relative: false

imu0: /imu/data
# The current Gazebo IMU reports a world-referenced ENU orientation.  Fuse its
# absolute yaw and z angular velocity as the single heading authority.  Keep
# relative=false so the filter retains the frozen scenario's absolute odom
# coordinates; a real vehicle must replace this with a calibrated absolute
# heading source (or migrate the complete goal/frame contract together).
imu0_config: [false, false, false,
              false, false, true,
              false, false, false,
              false, false, true,
              false, false, false]
imu0_queue_size: 30
imu0_nodelay: true
imu0_differential: false
imu0_relative: false
imu0_remove_gravitational_acceleration: true

# The filter emits body-frame twist, matching REP-105 and the memory-backend
# local-planner launch parameter.  No Gazebo pose or velocity topic is fused.
