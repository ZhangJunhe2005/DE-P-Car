schema: DEPCarP3V3IncrementalConfigV1
wave:
  id: wave01
  task_seed: 64000
  workers: 8
  selected_split_maps:
    train: 31
    validation: 5
  maximum_tasks_per_map: 8
  proposal_attempts_per_map_mode: 200
  proposals_per_map_mode: 8
  hybrid_astar_maximum_expansions: 60000
  task_quotas:
    train:
      NARROW_CORRIDOR: 54
      SHARP_TURN: 36
      THREE_POINT_TURN: 36
      DEAD_END_ESCAPE: 18
    validation:
      NARROW_CORRIDOR: 12
      SHARP_TURN: 9
      THREE_POINT_TURN: 12
      DEAD_END_ESCAPE: 3
  preflight:
    schema: P3V3CanonicalLatticeContinuousSweepPreflightV1
    route_checkpoints: 7
    minimum_feasible_candidates_per_probe: 2
    forward_speed_probes_mps: [0.0, 0.6]
    reverse_speed_probes_mps: [0.0, -0.2]
    require_every_probe: true
collection:
  ros_master_port: 11421
  gazebo_master_port: 11451
  startup_timeout_s: 90
  episode_timeout_s: 22
  shutdown_timeout_s: 30
  extraction_stride: 1
  minimum_samples_per_episode: 20
  minimum_free_disk_gb: 20
  keep_bags: true
base_reextract:
  workers: 8
  splits: [train, validation]
bundle:
  id: p3_v3_bundle_v1
  workers: 8
  materialization: copy
  sources:
    - name: base_reextracted
      samples: data/p3_v3/base_reextracted/samples
      authority: data/p3_v3/base_reextracted/reextract_state.json
    - name: wave01
      samples: data/p3_v3/waves/wave01/run/samples
      authority: data/p3_v3/waves/wave01/run/collection_state.json
      task_manifest: data/p3_v3/waves/wave01/task_manifest.json
gates:
  maximum_zero_feasible_rate: 0.10
  maximum_per_mode_zero_feasible_rate: 0.25
  minimum_median_feasible_candidates: 2
  minimum_validation_frames_per_maneuver: 50
  minimum_validation_frames_per_requested_gear: 100
  minimum_validation_frames_per_candidate_context: 20
  required_candidate_contexts: [MISSION, RECOVERY]
  allowed_candidate_contexts: [MISSION, RECOVERY]
  required_maneuvers:
    - NORMAL
    - SHARP_TURN
    - NARROW_CORRIDOR
    - U_TURN
    - DEAD_END_ESCAPE
    - REVERSE_EXIT
    - THREE_POINT_TURN
  required_requested_gears: [FORWARD, REVERSE]
