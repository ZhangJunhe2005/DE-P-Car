contract:
  schema: DEPCarSensorContractV2
  authority: gazebo_training_simulation
  timestamp_anchor: lidar
  maximum_depth_lidar_skew_s: 0.05
  maximum_odom_skew_s: 0.02
  maximum_imu_source_distance_s: 0.02
  maximum_joint_state_skew_s: 0.05
  formal_state_alignment: bracket_and_interpolate_to_lidar_stamp
  raw_episode_is_authoritative: true
depth:
  topic: /camera/depth/image_raw
  frame: camera_depth_optical_frame
  encoding: 32FC1
  rate_hz: 15.0
  minimum_range_m: 0.20
  maximum_range_m: 10.0
  training_shape: [2, 96, 160]
  training_channels: [metric_depth_normalized_by_10m, pixel_validity]
lidar:
  topic: /velodyne_points
  frame: velodyne
  body_frame: chassis
  transform_at_measurement_stamp: true
  mount_chassis_xyz_m: [0.0, 0.0, 0.5833333333333334]
  scan_plane_chassis_z_m: 0.5959
  scan_plane_above_body: true
  channels: 16
  azimuth_samples: 440
  rate_hz: 10.0
  scan_timing:
    simulator_model: gazebo_ray_instantaneous_snapshot
    scan_period_s: 0.10
    ros_header_semantics: snapshot_measurement_time
    per_point_time_field_present: true
    per_point_time_field_observed_range_s: [0.0, 0.0]
    per_point_time_available: false
    scan_start_equals_scan_end: true
    deskew_required_in_gazebo: false
    real_vlp16_policy: require_per_point_timing_and_motion_distortion_audit
  ray_minimum_m: 0.15
  valid_minimum_m: 0.20
  planning_maximum_m: 40.0
  full_azimuth_rad: 6.283185307179586
  self_filter:
    frame: chassis
    length_m: 0.49666666666666665
    width_m: 0.27666666666666667
    padding_m: 0.03
    raw_points_retained_in_authoritative_rosbag: true
    raw_points_embedded_in_formal_npz: false
  obstacle_height_band_chassis_m: [0.05, 1.30]
  rolling_costmap_unknown_ego_clearance_radius_m: 0.45
  simulated_close_range_override: true
  real_vlp16_transfer_warning: >-
    The simulated 0.20 m minimum is not a physical VLP-16 guarantee. Real
    deployment requires near-field sensing or a hardware-specific safety case.
bev:
  extent_m: 8.0
  resolution_m: 0.10
  channels: [occupancy, log_density, minimum_height, maximum_height, nearest_range, observed]
