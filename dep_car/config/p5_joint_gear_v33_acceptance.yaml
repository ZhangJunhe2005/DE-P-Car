schema: DEPCarJointGearV33AcceptanceContractV1
revision: 1
test_split_sealed: true

# Candidate capability is inherited unchanged from the frozen V3.1 base.
candidate:
  maximum_zero_hard_feasible_rate: 0.08
  minimum_forward_bank_capable_rate: 0.80
  minimum_reverse_bank_capable_rate: 0.60

# These metrics are evaluated on the explicit logits before hard-safety
# fallback, so an execution veto cannot hide a gear-classification error.
selector:
  maximum_unnecessary_reverse_rate: 0.05
  minimum_oracle_reverse_recall_within_required: 0.95
  maximum_oracle_forward_false_reverse_rate_within_required: 0.03
  minimum_no_hard_forward_reverse_selection_rate: 0.92

# Runtime first searches the requested bank for a hard-safe trajectory.  Only
# if that bank is empty may it fall back to the other bank; every fallback is
# reported and bounded here.
execution:
  minimum_requested_bank_hard_available_rate: 0.95
  maximum_hard_safety_fallback_rate: 0.03
  minimum_post_veto_selected_hard_feasible_rate: 0.99

scope: P6_SHADOW_ONLY
active_control_authorized_by_acceptance: false
production_qualified_by_acceptance: false
